<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Зв’язок</title>
</head>
<body>
    <h1>Зв’язок з туристичним агентом</h1>

    <!-- Форма зв'язку (Завдання 1) -->
    <form>
        <label>Ваше ім'я:</label><br>
        <input type="text" name="name" placeholder="Введіть ім'я"><br><br>

        <label>Повідомлення:</label><br>
        <textarea name="message" placeholder="Куди хочете поїхати?"></textarea><br><br>

        <button type="button">Надіслати запит</button>
    </form>

    <hr>

    <!-- Кнопка повернення на головну за допомогою url_for() -->
    <nav>
        <a href="{{ url_for('index') }}">
            <button>Повернутися назад на головну</button>
        </a>
    </nav>
</body>
</html>
